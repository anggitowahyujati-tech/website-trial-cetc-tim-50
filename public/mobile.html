<title>ATLAS Mobile · CETC ITB 2027</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a3a8e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ATLAS"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bl:#0a84ff;--g:#34c759;--o:#ff9f0a;--r:#ff3b30;--tx:#1c1c1e;--mu:#5f6673;--ln:rgba(60,70,100,.12);--pt:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font:16px/1.3 -apple-system,"SF Pro Text","Inter",system-ui,sans-serif;color:var(--tx);background:#e9ecf3}
body{display:flex;gap:36px;justify-content:center;align-items:center;min-height:100dvh;padding:20px}
#side{width:270px}#side h3{margin:0 0 4px;font-size:17px}#side p{margin:0 0 14px;color:var(--mu);font-size:13px}
#side button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;font:14px inherit;color:var(--mu);cursor:pointer}#side button.on{background:#fff;color:var(--tx);font-weight:600}
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:58px;border:11px solid #1b1b1e;background:#000;box-shadow:0 30px 60px rgba(30,50,100,.25)}
.isl{position:absolute;top:11px;left:50%;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px;z-index:6}
.scr{position:absolute;inset:0;border-radius:46px;overflow:hidden;background:linear-gradient(180deg,#0a3a8e 0,#3b78cb 15%,#9cc0ee 31%,#e8ecf6 50%,#e8edf8 78%,#cadcfa 100%)}
.scr.dk{background:radial-gradient(circle at 92% 40%,#76594a 0,transparent 42%),linear-gradient(#0a0e17,#161c28 70%)}

#sc{position:absolute;inset:0;overflow-y:auto;padding:var(--pt) 20px 120px;scrollbar-width:none}#sc.nn{padding-bottom:50px}#sc::-webkit-scrollbar{display:none}
.hl{color:#fff;font-size:15px;font-weight:500}h1{color:#fff;font-size:40px;line-height:1.05;margin:2px 0 18px;font-weight:700;letter-spacing:-1.2px;text-shadow:0 2px 14px rgba(0,30,90,.25)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.52),rgba(255,255,255,.14) 55%,rgba(255,255,255,.3));backdrop-filter:blur(32px) saturate(2) brightness(1.06);-webkit-backdrop-filter:blur(32px) saturate(2) brightness(1.06);border:1px solid rgba(255,255,255,.45);border-radius:30px;padding:16px 20px;margin-bottom:14px;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.4),inset 0 0 18px rgba(255,255,255,.18),0 12px 32px rgba(20,50,110,.18)}
.card.l{padding:4px 20px;background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(240,246,255,.38) 60%,rgba(255,255,255,.5))}
.lb{color:var(--mu);font-size:15px}.sec{color:var(--mu);font-size:17px;margin:16px 8px 8px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:17px}.row:last-child{border:0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:12px;vertical-align:1px}
.tag{border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600;background:rgba(10,132,255,.14);color:#0a5fc4;white-space:nowrap}.tag.g{background:rgba(52,199,89,.22);color:#1d8a3a}.tag.o{background:rgba(255,159,10,.25);color:#a35f00}.tag.r{background:rgba(255,59,48,.18);color:#c9261c}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.chip{border:0;border-radius:99px;padding:10px 18px;font:inherit;font-size:16px;background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.25));backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);color:var(--tx);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 4px 14px rgba(20,50,110,.12);cursor:pointer}.chip.on{background:linear-gradient(180deg,#4aa3ff,#0a7bff);color:#fff;border-color:rgba(255,255,255,.4);font-weight:600;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 16px rgba(10,132,255,.35)}.chip.y.on{background:#ffe2a0;color:#6b4300;border-color:#ffe2a0}
.btn{width:100%;height:58px;border:0;border-radius:29px;background:linear-gradient(180deg,#3d9dff,#0a7bff);color:#fff;font:500 17px inherit;cursor:pointer;margin:4px 0 8px;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 10px 24px rgba(10,132,255,.35)}.btn.d{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(150,150,160,.3));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#d12a20;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),0 6px 16px rgba(20,40,90,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin:0}.mb{margin-bottom:14px}
.big{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1.05}.mid{font-size:42px;font-weight:700;letter-spacing:-1.2px;line-height:1}.mid small{font-size:17px;font-weight:400;letter-spacing:0;color:var(--mu)}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:6px}.act button{background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.16) 60%,rgba(255,255,255,.32));backdrop-filter:blur(28px) saturate(2);-webkit-backdrop-filter:blur(28px) saturate(2);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),0 10px 26px rgba(20,50,110,.16);border:1px solid rgba(255,255,255,.45);border-radius:28px;height:108px;font:500 16px inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--tx)}.act svg{color:var(--bl)}
.bw{padding:10px 0;cursor:pointer}.bar{height:8px;border-radius:9px;background:rgba(120,120,128,.2);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl);border-radius:9px}.bar.g i{background:var(--g)}
.ph{display:flex;gap:14px;margin-top:10px}.ph button{width:84px;height:84px;border-radius:22px;border:0;background:rgba(120,130,150,.18);font-size:34px;font-weight:300;color:var(--bl);cursor:pointer}.ph button:first-child{background:rgba(10,132,255,.18)}
textarea{width:100%;min-height:96px;border:0;background:transparent;font:inherit;font-size:19px;color:var(--tx);resize:none;outline:0}textarea::placeholder{color:#6b7280}
.vf{width:236px;height:236px;border:3px solid #fff;border-radius:32px;margin:44px auto 0;background:radial-gradient(circle at 70% 20%,rgba(120,90,70,.5),rgba(20,26,38,.5))}
.sheet{position:absolute;left:14px;right:14px;bottom:34px;background:linear-gradient(160deg,rgba(215,215,222,.72),rgba(170,172,182,.62));backdrop-filter:blur(36px) saturate(1.8);-webkit-backdrop-filter:blur(36px) saturate(1.8);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),0 16px 40px rgba(0,0,0,.35);border-radius:28px;padding:14px}
.sheet .c2{background:rgba(255,255,255,.7);border-radius:14px;padding:9px 12px;box-shadow:inset 0 1px 1px #fff}.sheet .btn{height:46px;font-size:16px;margin:0;border-radius:23px}
nav{position:absolute;left:18px;right:18px;bottom:30px;height:70px;display:flex;border-radius:36px;background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.35));backdrop-filter:blur(36px) saturate(2.2);-webkit-backdrop-filter:blur(36px) saturate(2.2);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.4),0 14px 34px rgba(20,50,110,.22)}
nav button{flex:1;border:0;background:none;color:#555c69;font:13px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}nav .on{color:var(--bl)}
.hi{position:absolute;left:50%;bottom:9px;width:136px;height:5px;margin-left:-68px;border-radius:9px;background:#111;z-index:5}.dk .hi{background:#fff}
.pill{display:block;margin:14px auto 0;border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 6px 18px rgba(20,50,110,.14);background:linear-gradient(160deg,rgba(255,255,255,.65),rgba(255,255,255,.3));border-radius:99px;padding:9px 18px;font:15px inherit;color:#444;cursor:pointer}
#toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,30px);opacity:0;background:rgba(20,24,34,.9);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;transition:.3s;z-index:9;white-space:nowrap;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
